<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Studio</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="store.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body>

    <div class="store-page">

        <header>
            Our Studio
        </header>
        <div class="store-container">

            <div class="store-heading">
                <h1>Visit Our Studio</h1>
                <p>We'd love to hear about your photography plans.</p>
            </div>

            <div class="store-details">

                <div class="store-card">
                    <i class="fa-solid fa-location-dot"></i>
                    <h3>Our Location</h3>
                    <p>Studio address will be added here.</p>
                </div>

                <div class="store-card">
                    <i class="fa-solid fa-phone"></i>
                    <h3>Contact</h3>
                    <p>Phone number will be added here.</p>
                </div>

                <div class="store-card">
                    <i class="fa-solid fa-clock"></i>
                    <h3>Working Hours</h3>
                    <p>Working hours will be added here.</p>
                </div>

            </div>

                <div class="store-map">
                    <h2>Find Us</h2>
                    <p>Our map will be added here.</p>
            </div>

        </div>
    </div>

</body>

</html>
