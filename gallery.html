<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
</head>

<body>

    <div class="gallery-page">

        <header>
            Gallery
        </header>
        <div class="gallery-container">

            <div class="gallery-heading">
                <h1>Our Photography</h1>
                <p>A collection of moments, stories, and memories.</p>
            </div>

            <div class="gallery-grid">

                <div class="gallery-item">
                    <img src="/assets/weddingicon.png" alt="Wedding photography">
                </div>

                <div class="gallery-item">
                    <img src="/assets/eventsicon.png" alt="Corporate event photography">
                </div>

                <div class="gallery-item">
                    <img src="/assets/functionsicon.png" alt="Family function photography">
                </div>

                <div class="gallery-item">
                    <img src="/assets/confrencesicon.png" alt="Conference photography">
                </div>

                <div class="gallery-item">
                    <img src="/assets/tripshoot.png" alt="Travel photography">
                </div>

                <div class="gallery-item">
                    <img src="/assets/vlogs.png" alt="Creative shoot photography">
                </div>

            </div>

        </div>
    </div>

</body>

</html>
