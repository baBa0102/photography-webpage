<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>photography website</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="booking.css">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
</head>

<body>

    <div class="mainbox">

        <header>
            <span>Book a Service</span>
        </header>

        <div class="services">

            <ul class="serviceList">

                <li>
                    <div class="serviceimage">
                        <img src="fullpackage.png" alt="icon image">
                    </div>

                    <div class="serviceinfo">
                        <h3>Full Package</h3>
                        <dd>Full package includes any sort of event and charges are applied on hourly</dd>
                    </div>
                </li>

                <li>
                    <div class="serviceimage">
                        <img src="weddingicon.png" alt="icon image">
                    </div>

                    <div class="serviceinfo">
                        <h3>Wedding</h3>
                    </div>
                </li>

                <li>
                    <div class="serviceimage">
                        <img src="eventsicon.png" alt="icon image">
                    </div>

                    <div class="serviceinfo">
                        <h3>Corporate Events</h3>
                    </div>
                </li>

                <li>
                    <div class="serviceimage">
                        <img src="functionsicon.png" alt="image icon">
                    </div>

                    <div class="serviceinfo">
                        <h3>Family Functions</h3>
                    </div>
                </li>

                <li>
                    <div class="serviceimage">
                        <img src="confrencesicon.png" alt="icon image">
                    </div>

                    <div class="serviceinfo">
                        <h3>Confreces</h3>
                    </div>
                </li>

                <li>
                    <div class="serviceimage">
                        <img src="tripshoot.png" alt="icon image">
                    </div>

                    <div class="serviceinfo">
                        <h3>Trip shoot</h3>
                    </div>
                </li>

                <li>
                    <div class="serviceimage">
                        <img src="vlogs.png" alt="icon image">
                    </div>

                    <div class="serviceinfo">
                        <h3>Vlogs/Music or any profitable shoot</h3>
                    </div>
                </li>

            </ul>

        </div>

    </div>

</body>
</html>
