<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <link rel="stylesheet" href="bookingForm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <div class="booking-form-page">

        <div class="booking-form-container">

            <h1>Book Your Service</h1>

            <p class="subtitle">
                Fill in the details below and we'll get back to you shortly.
            </p>


            <form id="bookingForm">

                <!-- Service -->

                <label for="service">Selected Service</label>

                <div class="inputBox">
                    <i class="fa-solid fa-camera"></i>

                    <select id="service" name="service">
                        <option value="full-package">Full Package</option>
                        <option value="wedding">Wedding</option>
                        <option value="corporate-events">Corporate Events</option>
                        <option value="family-functions">Family Functions</option>
                        <option value="conferences">Conferences</option>
                        <option value="trip-shoot">Trip Shoot</option>
                        <option value="vlog-music">
                            Vlogs / Music / Profitable Shoot
                        </option>
                    </select>
                </div>


                <!-- Full Name -->

                <label for="name">Full Name</label>

                <div class="inputBox">
                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- Email + Phone -->

                <div class="form-row">

                    <div>
                        <label for="email">Email</label>

                        <div class="inputBox">
                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                    </div>


                    <div>
                        <label for="phone">Phone Number</label>

                        <div class="inputBox">
                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter your phone number"
                                required
                            >
                        </div>
                    </div>

                </div>


                <!-- Date + Time -->

                <div class="form-row">

                    <div>
                        <label for="date">Event Date</label>

                        <div class="inputBox">
                            <i class="fa-solid fa-calendar"></i>

                            <input
                                type="date"
                                id="date"
                                name="date"
                                required
                            >
                        </div>
                    </div>


                    <div>
                        <label for="time">Event Time</label>

                        <div class="inputBox">
                            <i class="fa-solid fa-clock"></i>

                            <input
                                type="time"
                                id="time"
                                name="time"
                                required
                            >
                        </div>
                    </div>

                </div>


                <!-- Location -->

                <label for="location">Event Location</label>

                <div class="inputBox">
                    <i class="fa-solid fa-location-dot"></i>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter event location"
                        required
                    >
                </div>


                <!-- Additional Details -->

                <label for="details">Additional Details</label>

                <div class="textareaBox">
                    <i class="fa-solid fa-message"></i>

                    <textarea
                        id="details"
                        name="details"
                        placeholder="Tell us anything we should know..."
                    ></textarea>
                </div>


                <!-- Submit -->

                <button type="submit">
                    <i class="fa-solid fa-check"></i>
                    Confirm Booking
                </button>

            </form>

        </div>

    </div>

<script>
    const bookingForm = document.querySelector("#bookingForm");

    bookingForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const formData = {
            service: document.querySelector("#service").value,
            name: document.querySelector("#name").value,
            email: document.querySelector("#email").value,
            phone: document.querySelector("#phone").value,
            date: document.querySelector("#date").value,
            time: document.querySelector("#time").value,
            location: document.querySelector("#location").value,
            details: document.querySelector("#details").value
        };

        try {
            const response = await fetch("http://localhost:3000/api/bookings", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Booking request failed.");
            }

            alert(data.message);
            bookingForm.reset();
        } catch (error) {
                console.error("Booking error:", error);
                alert(error.message);
            }
    });
</script>

</body>
</html>
