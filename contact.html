<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="contact-page">
        <header>
            Contact Us
        </header>
        <div class="contact-container">
        <div class="contact-heading">
            <h1>Get in Touch</h1>
            <p>Have a question or want to discuss your event? Send us a message.</p>
        </div>
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" name="" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email " required>
            </div>
            <div class="form-group">
                <label for="subject">Subject </label>
                <input
                type="text"
                id="subject"
                name="subject"
                placeholder="What is your inquiry about?"
                required>
            </div>
            <div class="form-group">
                <label for="message">Your Message </label>
                <textarea name="message" id="message" rows="5" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
